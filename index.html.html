<style>
  html,body{margin:0;height:100%;background:#17120f}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
  #up{position:fixed;top:20px;left:20px;z-index:5;display:flex;flex-direction:column;gap:12px;
      width:250px;padding:16px;border-radius:12px;background:rgba(12,9,8,.82);
      max-height:calc(100vh - 40px);overflow-y:auto;
      border:1px solid rgba(217,164,65,.35);backdrop-filter:blur(8px);
      font-family:"Barlow Condensed",system-ui,sans-serif;color:#f3e2c4}
  #up h1{margin:0;font-family:Cinzel,serif;font-size:14px;letter-spacing:.12em;color:#e0b25c;font-weight:700}
  #up p{margin:0;font-size:13px;line-height:1.35;color:#bda98c}
  .drop{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:8px;cursor:pointer;
        border:1px dashed rgba(217,164,65,.5);background:rgba(176,17,24,.10);transition:.15s}
  .drop:hover,.drop.over{background:rgba(176,17,24,.28);border-color:#e0b25c}
  .drop b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#f6e8cc}
  .drop span{font-size:12px;color:#bda98c}
  .drop img{width:100%;height:62px;object-fit:cover;border-radius:5px;display:none}
  .drop.has img{display:block}
  #up button{all:unset;text-align:center;padding:8px;border-radius:7px;cursor:pointer;font-size:12px;
             letter-spacing:.1em;text-transform:uppercase;color:#bda98c;border:1px solid rgba(217,164,65,.3)}
  #up button:hover{color:#f6e8cc;border-color:#e0b25c}
  #up input{display:none}
  #up .dl{display:flex;gap:8px}
  #up .dl a{flex:1;text-align:center;padding:8px 4px;border-radius:7px;font-size:12px;letter-spacing:.08em;
            text-transform:uppercase;color:#e0b25c;text-decoration:none;border:1px solid rgba(217,164,65,.3)}
  #up .dl a:hover{color:#f6e8cc;border-color:#e0b25c;background:rgba(176,17,24,.2)}
  #up .mode{display:flex;gap:6px}
  #up .mode .m{flex:1;text-align:center;padding:7px 2px;border-radius:7px;font-size:11px;
                letter-spacing:.06em;text-transform:uppercase;color:#bda98c;
                border:1px solid rgba(217,164,65,.28);cursor:pointer}
  #up .mode .m.on{color:#0b0708;background:#e0b25c;border-color:#e0b25c}
  #up hr{border:none;border-top:1px solid rgba(217,164,65,.22);margin:2px 0}
</style>

<three-d-stage name="pote-mockup" background="#1d1714" autorotate></three-d-stage>
<div id="up">
  <h1>SUA ARTE</h1>
  <p>Suba as duas artes para substituir os rótulos do mockup.</p>
  <label class="drop" id="dropTop">
    <b>Tampa</b><span>arte circular (1:1)</span>
    <img id="prevTop" alt="">
    <input type="file" id="fileTop" accept="image/*">
  </label>
  <label class="drop" id="dropWrap">
    <b>Corpo · wrap 360°</b>    <span>arte deitada · proporção 7,6:1 (ex. 3072×403). "Preencher" corta topo e base.</span>
    <img id="prevWrap" alt="">
    <input type="file" id="fileWrap" accept="image/*">
  </label>
  <div class="mode">
    <button class="m" data-mode="repeat">Repetir</button>
    <button class="m" data-mode="cover">Preencher</button>
    <button class="m" data-mode="contain">Encaixar</button>
  </div>
  <button id="girar">▶ Girar</button>
  <button id="reset">Voltar ao original</button>
  <p id="aviso" style="color:#e0b25c"></p>
  <hr>
  <p>Gabaritos em mm com corte, sangria e área segura — abra no Illustrator.</p>

    <a href="#" id="dlTampa">Tampa</a>

    <path d="M3 3v-3M258 3v-3M3 36.5v3M258 36.5v3" stroke="#111" stroke-width="0.2"></path>
    <g font-size="2.6">
      <text x="5" y="1.9" fill="#00a3ff" font-size="2.2">sangria 261 × 39,5 mm</text>
      <text x="5" y="6.2" fill="#ff0055">corte 255 × 33,5 mm — exporte só esta área</text>
      <text x="5" y="10.4" fill="#12b886" font-size="2.2">área segura 247 × 25,5 mm</text>
      <text x="132" y="20" fill="#9aa0a6" font-size="2.2">emenda / costas do pote</text>
      <text x="5" y="38" fill="#9aa0a6" font-size="2.2">Wrap 360°: a borda esquerda encosta na direita — continue a arte nas duas pontas. Exportar PNG na proporção 7,6:1 — 3072 × 403 px ou mais.</text>
    </g>
  </g>
</svg></script>
<script>
(function () {
  function baixar(id, nome) {
    var src = document.getElementById(id).textContent;
    var url = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' }));
    var a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  document.getElementById('dlTampa').addEventListener('click', function (e) {
    e.preventDefault(); baixar('svgTampa', 'gabarito-tampa.svg');
  });
  document.getElementById('dlCorpo').addEventListener('click', function (e) {
    e.preventDefault(); baixar('svgCorpo', 'gabarito-corpo.svg');
  });
})();
</script>

<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
await (document.fonts ? document.fonts.ready : Promise.resolve());

const GOLD = '#d9a441', GOLD_HI = '#f6e3a1', RED = '#b01118', RED_DK = '#460508';

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function tex(canvas, repeatX) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeatX) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = repeatX; }
  return t;
}
function goldFill(ctx, x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#8c5a1c'); g.addColorStop(.35, GOLD_HI);
  g.addColorStop(.55, GOLD); g.addColorStop(.8, '#9c6a22'); g.addColorStop(1, GOLD_HI);
  return g;
}
function ring(ctx, cx, cy, r, w) {
  ctx.lineWidth = w;
  ctx.strokeStyle = goldFill(ctx, cx - r, cy - r, cx + r, cy + r);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
}
function palm(ctx, x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(-3, 0); ctx.quadraticCurveTo(2, -60, 14, -104);
  ctx.lineTo(20, -104); ctx.quadraticCurveTo(8, -58, 5, 0); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI + i * (Math.PI / 6.2);
    ctx.beginPath(); ctx.moveTo(16, -104);
    ctx.quadraticCurveTo(16 + Math.cos(a) * 34, -104 + Math.sin(a) * 30 - 14,
                         16 + Math.cos(a) * 62, -104 + Math.sin(a) * 40 + 8);
    ctx.quadraticCurveTo(16 + Math.cos(a) * 32, -104 + Math.sin(a) * 26 + 4, 16, -100);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function compass(ctx, cx, cy, r) {
  ctx.save();
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  bg.addColorStop(0, '#2a0407'); bg.addColorStop(1, '#140203');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ring(ctx, cx, cy, r * .97, r * .07);
  ring(ctx, cx, cy, r * .62, r * .035);
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, len = i % 2 ? r * .42 : r * .86;
    ctx.fillStyle = goldFill(ctx, cx - r, cy - r, cx + r, cy + r);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
    ctx.lineTo(cx + Math.cos(a + .34) * r * .17, cy + Math.sin(a + .34) * r * .17);
    ctx.lineTo(cx + Math.cos(a - .34) * r * .17, cy + Math.sin(a - .34) * r * .17);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = GOLD_HI;
  ctx.font = `700 ${r * .3}px Cinzel, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  [['N', 0, -r * .78], ['S', 0, r * .78], ['L', r * .78, 0], ['O', -r * .78, 0]]
    .forEach(([t, dx, dy]) => ctx.fillText(t, cx + dx, cy + dy));
  ctx.restore();
}
function ship(ctx, cx, base, s) {
  ctx.save(); ctx.translate(cx, base); ctx.scale(s, s);
  ctx.fillStyle = '#1b0204';
  ctx.beginPath(); ctx.moveTo(-96, 0); ctx.quadraticCurveTo(0, 40, 96, 0);
  ctx.lineTo(74, -26); ctx.lineTo(-78, -26); ctx.closePath(); ctx.fill();
  ctx.fillRect(-3, -230, 6, 205);
  ctx.fillRect(-62, -180, 5, 155); ctx.fillRect(58, -168, 5, 143);
  const sail = (x, y, w, h, lean) => {
    const g = ctx.createLinearGradient(x - w, y, x + w, y + h);
    g.addColorStop(0, '#7c0a11'); g.addColorStop(.5, '#d2252c'); g.addColorStop(1, '#61070d');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x - w, y); ctx.lineTo(x + w, y);
    ctx.quadraticCurveTo(x + w + lean, y + h * .6, x + w * .5, y + h);
    ctx.lineTo(x - w * .8, y + h); ctx.quadraticCurveTo(x - w - lean, y + h * .5, x - w, y);
    ctx.closePath(); ctx.fill();
  };
  sail(0, -218, 34, 70, 14); sail(0, -142, 46, 78, 18); sail(0, -58, 40, 32, 10);
  sail(-60, -172, 26, 60, 10); sail(58, -160, 24, 56, 10);
  ctx.restore();
}
function seaSky(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#3d0509'); g.addColorStop(.42, '#a7121a');
  g.addColorStop(.52, '#d8242c'); g.addColorStop(.56, '#6e0a10');
  g.addColorStop(1, '#210305');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const sun = ctx.createRadialGradient(w * .27, h * .3, 0, w * .27, h * .3, h * .22);
  sun.addColorStop(0, 'rgba(255,236,198,.95)'); sun.addColorStop(.5, 'rgba(255,160,120,.25)');
  sun.addColorStop(1, 'rgba(255,120,90,0)');
  ctx.fillStyle = sun; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  for (let i = 0; i < 60; i++) {
    const y = h * .56 + Math.random() * h * .42;
    ctx.fillRect(Math.random() * w, y, 30 + Math.random() * 90, 1.5);
  }
}

/* ---------- rótulos em branco (base do mockup) ---------- */
const [topC, tc] = cv(1400, 1400);
(() => {
  const S = 1400, cx = S / 2;
  tc.fillStyle = '#0b0708'; tc.fillRect(0, 0, S, S);
  tc.save();
  tc.beginPath(); tc.arc(cx, cx, S * .455, 0, 7); tc.clip();
  tc.fillStyle = '#f6f3ee'; tc.fillRect(0, 0, S, S);
  tc.restore();
  ring(tc, cx, cx, S * .448, 22);
})();

const [wrapC, wc] = cv(3072, 403);
(() => {
  wc.fillStyle = '#f6f3ee'; wc.fillRect(0, 0, 3072, 403);
  wc.fillStyle = goldFill(wc, 0, 0, 3072, 40);
  wc.fillRect(0, 0, 3072, 10); wc.fillRect(0, 393, 3072, 10);
})();

/* ---------- materiais ---------- */
const plastic = new THREE.MeshStandardMaterial({ name: 'plastico_preto', color: 0x141314, roughness: .28, metalness: .18 });
const plasticSide = new THREE.MeshStandardMaterial({ name: 'plastico_preto_fosco', color: 0x0f0e0f, roughness: .5, metalness: .1 });
const gold = new THREE.MeshStandardMaterial({ name: 'dourado', color: 0xe0b25c, roughness: .3, metalness: .38 });
const paste = new THREE.MeshStandardMaterial({ name: 'pasta_morango', color: 0xf3dfe2, roughness: .6, metalness: 0 });
const labelTop = new THREE.MeshStandardMaterial({ name: 'rotulo_tampa', map: tex(topC), roughness: .22, metalness: .12 });
const labelWrap = new THREE.MeshStandardMaterial({ name: 'rotulo_corpo', map: tex(wrapC), roughness: .26, metalness: .12 });

/* ---------- geometria ---------- */
const R = 0.040, BODY_H = 0.042, LID_H = 0.024, LID_R = 0.0425;
const jar = new THREE.Group(); jar.name = 'pote_mockup';
const add = (name, geo, mat, y, rx, ry, rz) => {
  const m = new THREE.Mesh(geo, mat);
  m.name = name; m.position.y = y;
  m.rotation.set(rx || 0, ry || 0, rz || 0);
  jar.add(m); return m;
};

// corpo
add('corpo', new THREE.CylinderGeometry(R, R * .985, BODY_H, 96, 1, false), plasticSide, BODY_H / 2);
add('rotulo_corpo', new THREE.CylinderGeometry(R + .0006, R + .0006, 0.0335, 96, 1, true), labelWrap, 0.0190, 0, -1.42);
add('pasta', new THREE.CylinderGeometry(R - .0025, R - .0025, .0005, 64), paste, BODY_H - .0016);
add('base_pe', new THREE.TorusGeometry(R * .95, .0016, 16, 96), plastic, .0016, Math.PI / 2);
add('aro_topo_rotulo', new THREE.TorusGeometry(R + .0008, .0009, 12, 128), gold, 0.0357, Math.PI / 2);
add('aro_base_rotulo', new THREE.TorusGeometry(R + .0008, .0009, 12, 128), gold, 0.0024, Math.PI / 2);

// tampa
add('tampa_lateral', new THREE.CylinderGeometry(LID_R, LID_R, LID_H, 96, 1, true), plasticSide, BODY_H + LID_H / 2 - .004);
add('tampa_topo', new THREE.CylinderGeometry(LID_R, LID_R, .004, 96), plastic, BODY_H + LID_H - .004);
add('rotulo_tampa', new THREE.CircleGeometry(LID_R * .95, 96), labelTop, BODY_H + LID_H - .0018, -Math.PI / 2, 0, 0.675);
add('aro_tampa', new THREE.TorusGeometry(LID_R * .995, .0018, 16, 128), gold, BODY_H + LID_H - .0038, Math.PI / 2);
add('aro_base_tampa', new THREE.TorusGeometry(LID_R, .0014, 14, 128), plastic, BODY_H - .0038, Math.PI / 2);

jar.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.setObject(jar);

/* ---------- upload das artes do usuário ---------- */
const KEY = 'mockup-labels';
// proporção real de cada rótulo: a arte é encaixada dentro (contain), nunca esticada
const FIT = { top: [1400, 1400], wrap: [3072, 403] };
const slots = {
  top: { mat: labelTop, base: labelTop.map, prev: prevTop, drop: dropTop, input: fileTop, repeat: 0 },
  wrap: { mat: labelWrap, base: labelWrap.map, prev: prevWrap, drop: dropWrap, input: fileWrap, repeat: 0 }
};
const store = JSON.parse(localStorage.getItem(KEY) || '{}');

let mode = store.mode || 'repeat';
function applyArt(which, dataURL) {
  const s = slots[which];
  const img = new Image();
  img.onload = () => {
    const [W, H] = FIT[which];
    const [c, x] = cv(W, H);
    x.fillStyle = '#0b0708'; x.fillRect(0, 0, W, H);
    if (which === 'wrap' && mode === 'repeat') {
      // repetida ao redor do pote; escala uniforme nos dois eixos, centralizada
      const nat = img.width * (H / img.height);
      const n = Math.max(1, Math.round(W / nat));
      const step = W / n;
      const k = step / img.width;           // mesma escala em X e Y
      const th = img.height * k, ty = (H - th) / 2;
      for (let i = 0; i < n; i++) x.drawImage(img, i * step, ty, step, th);
    } else if (mode === 'cover') {
      const k = Math.max(W / img.width, H / img.height);
      const w = img.width * k, ht = img.height * k;
      x.drawImage(img, (W - w) / 2, (H - ht) / 2, w, ht);
    } else {
      const k = Math.min(W / img.width, H / img.height);
      const w = img.width * k, ht = img.height * k;
      x.drawImage(img, (W - w) / 2, (H - ht) / 2, w, ht);
    }
    const t = tex(c, which === 'wrap' ? 1 : 0);
    if (which === 'wrap') t.wrapS = THREE.RepeatWrapping;
    s.mat.map = t; s.mat.needsUpdate = true;
  };
  img.src = dataURL;
  s.prev.src = dataURL; s.drop.classList.add('has');
}
function syncMode() {
  document.querySelectorAll('#up .m').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
}
document.querySelectorAll('#up .m').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode; store.mode = mode; syncMode();
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  Object.keys(slots).forEach(w => { if (store[w]) applyArt(w, store[w]); });
}));
syncMode();
function readFile(which, file) {
  if (!file || !file.type.startsWith('image/')) return;
  const fr = new FileReader();
  fr.onload = () => {
    applyArt(which, fr.result);
    // guarda uma versão reduzida (máx. 3072 px) para caber na cota do navegador
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 3072 / im.width);
      const [c, x] = cv(Math.round(im.width * k), Math.round(im.height * k));
      x.drawImage(im, 0, 0, c.width, c.height);
      store[which] = c.toDataURL('image/jpeg', 0.9);
      try {
        localStorage.setItem(KEY, JSON.stringify(store));
        aviso.textContent = '';
      } catch (e) {
        aviso.textContent = 'Arte muito grande para salvar — vale só nesta sessão.';
      }
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
Object.entries(slots).forEach(([which, s]) => {
  s.input.addEventListener('change', e => readFile(which, e.target.files[0]));
  ['dragenter', 'dragover'].forEach(ev => s.drop.addEventListener(ev, e => {
    e.preventDefault(); s.drop.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(ev => s.drop.addEventListener(ev, e => {
    e.preventDefault(); s.drop.classList.remove('over');
  }));
  s.drop.addEventListener('drop', e => readFile(which, e.dataTransfer.files[0]));
  if (store[which]) applyArt(which, store[which]);
});
const sync = () => {
  girar.textContent = stage._controls && stage._controls.autoRotate ? '❚❚ Pausar' : '▶ Girar';
};
girar.addEventListener('click', () => {
  const c = stage._controls;
  if (!c) return;
  c.autoRotate = !c.autoRotate;
  sync();
});
if (stage._controls) stage._controls.addEventListener('start', sync);
sync();

reset.addEventListener('click', () => {
  Object.entries(slots).forEach(([which, s]) => {
    s.mat.map = s.base; s.mat.needsUpdate = true;
    s.prev.removeAttribute('src'); s.drop.classList.remove('has');
    delete store[which];
  });
  localStorage.setItem(KEY, JSON.stringify(store));
});
</script>
